name: Check repository
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q lamin_b1 methylation rna transposable_elements damid public_chromatin run.py
      - name: Check entry points and dependencies
        run: python -m unittest discover -s tests -v
